<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Welcome to My Dashboard</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Profile</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </nav>
    </header>

    <section class="content">
        <h2>Quick Overview</h2>
        <p id="welcomeText">Hello User! Have a great day 😊</p>

        <button id="changeTextBtn">Click Me</button>

        <div class="cards">
            <div class="card">
                <h3>Users</h3>
                <p>10 Active Users</p>
            </div>

            <div class="card">
                <h3>Notifications</h3>
                <p>5 New Alerts</p>
            </div>

            <div class="card">
                <h3>Messages</h3>
                <p>2 New Messages</p>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2025 Mini Project Dashboard</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
